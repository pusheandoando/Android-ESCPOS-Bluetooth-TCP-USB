// androidescpos/build.gradle





plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def libraryVersionCode = 1000000
def libraryVersionName = "1.0"

android {
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 33
        versionCode libraryVersionCode
        versionName libraryVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.zxing:core:3.4.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'com.github.pusheandoando'
                artifactId = 'Android-ESCPOS-Bluetooth-TCP-USB'
                version = libraryVersionName
                pom {
                    name = 'Android ESC/POS Thermal Printer SDK'
                    description = 'Android library for communicating with ESC/POS thermal printers over Bluetooth, TCP, and USB.'
                }
                afterEvaluate {
                    from components.release
                }
            }
        }
    }
}